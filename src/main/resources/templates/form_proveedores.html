<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Spark - Registro de Proveedores</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- NAVBAR VERTICAL (SIDEBAR) -->
    <aside class="sidebar-custom">
        <div class="sidebar-brand">
            <a href="/" class="navbar-brand-text">Tech Spark</a>
        </div>
        
        <ul class="sidebar-links">
            <li><a th:href="@{/}"><i class="bi bi-house-door"></i> Inicio</a></li>
            <li><a th:href="@{/proveedores}" class="active"><i class="bi bi-truck"></i> Proveedores</a></li>
            <li><a th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
        </ul>
        
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout-custom">
                    <i class="bi bi-box-arrow-left"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </aside>
    
    <div class="navbar-mobil">
        <a href="/" class="navbar-brand-text">Tech Spark</a>
        <button class="btn btn-hamburguesa" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuMovilDesplegable" aria-controls="menuMovilDesplegable">
            <i class="bi bi-list"></i>
        </button>
    </div>
    
    <div class="offcanvas offcanvas-start offcanvas-custom" tabindex="-1" id="menuMovilDesplegable" aria-labelledby="menuMovilDesplegableLabel">
        <div class="offcanvas-header d-flex align-items-center justify-content-between">
            <h5 class="navbar-brand-text id="menuMovilDesplegableLabel"">Tech Spark</h5>
            <button type="button" class="btn-close-white-custom" data-bs-dismiss="offcanvas" aria-label="Close">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="offcanvas-body">
            <ul class="sidebar-links">
                <li><a th:href="@{/}"><i class="bi bi-house-door"></i> Inicio</a></li>
                <li><a th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a></li>
                <li><a th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
            </ul>
            
            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout-custom">
                        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal-form">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6 col-xl-5">
                    
                    <!-- TARJETA DEL FORMULARIO -->
                    <div class="card card-form-custom">
                        <div class="card-header card-header-custom">
                            <h4 class="card-title-custom mb-0">
                                <i class="bi bi-plus-circle me-2"></i>Registrar Proveedor
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            
                            <form th:action="@{/proveedores/save}" th:object="${proveedor}" method="post">
                            
                                <!-- Campo Oculto ID -->
                                <input type="hidden" th:field="*{id}">
                                
                                <!-- Campo: Nombre Empresa -->
                                <div class="mb-3.5">
                                    <label for="nombreEmpresa" class="form-label">Nombre Empresa</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-building"></i></span>
                                        <input type="text" 
                                               th:field="*{nombreEmpresa}"
                                               th:classappend="${#fields.hasErrors('nombreEmpresa')} ? 'is-invalid'"
                                               class="form-control" 
                                               id="nombreEmpresa" 
                                               placeholder="Ingresa el nombre de la empresa"
                                               maxlength="100">
                                    </div>
                                    <div class="text-danger small mt-1" 
                                         th:if="${#fields.hasErrors('nombreEmpresa')}" 
                                         th:errors="*{nombreEmpresa}"></div>
                                </div>

                                <!-- Campo: Contacto -->
                                <div class="mb-3.5 mt-3">
                                    <label for="contacto" class="form-label">Contacto</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                        <input type="text" 
                                               th:field="*{contacto}"
                                               th:classappend="${#fields.hasErrors('contacto')} ? 'is-invalid'"
                                               class="form-control" 
                                               id="contacto" 
                                               placeholder="Ej. Encargado de las provisiones"
                                               maxlength="50">
                                    </div>
                                    <div class="text-danger small mt-1" 
                                         th:if="${#fields.hasErrors('contacto')}" 
                                         th:errors="*{contacto}"></div>
                                </div>
                                
                                <!-- Campo: Teléfono -->
                                <div class="mb-4 mt-3">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" 
                                               th:field="*{telefono}"
                                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                                               class="form-control" 
                                               id="telefono" 
                                               placeholder="Ej. 0000-0000"
                                               maxlength="10"
                                               pattern="^[0-9\-\+]+$"
                                               title="Solo números, guiones o '+'">
                                    </div>
                                    <div class="text-danger small mt-1" 
                                         th:if="${#fields.hasErrors('telefono')}" 
                                         th:errors="*{telefono}"></div>
                                </div>

                                <!-- Botones de Acción -->
                                <div class="d-flex flex-column gap-2 mt-4">
                                    <button type="submit" class="btn-guardar">
                                        <i class="bi bi-floppy me-2"></i>Guardar
                                    </button>
                                    <a th:href="@{/proveedores}" class="btn-cancelar text-center text-decoration-none">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                            
                        </div>
                    </div>
                    <!-- FIN DE LA TARJETA -->

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap Bundle Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
