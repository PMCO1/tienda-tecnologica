<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Tech Spark - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: url('/images/Fondo1.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
        }
        
        /* Capa de fondo oscura */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(7, 9, 15, 0.75);
            z-index: 0;
        }

        /* Tarjeta estilo Cristal Oscuro (Glassmorphism) */
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Título con degradado idéntico al Hero */
        .login-titulo {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .login-subtitulo {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2.5rem;
        }

        /* Estilo de los Inputs con Iconos */
        .input-group-text {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
        }

        /* Evitar que el autocompletado del navegador dañe el diseño oscuro */
        .form-control:-webkit-autofill {
            -webkit-text-fill-color: #fff !important;
            -webkit-box-shadow: 0 0 0px 1000px #1e293b inset !important;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }

        .form-control:focus + .input-group-text, 
        .input-group:focus-within .input-group-text {
            border-color: #6366f1;
            color: #6366f1;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        /* Botón Guardar / Iniciar sesión */
        .btn-login {
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-login:hover {
            background: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        /* Alertas Tecnológicas */
        .alert-custom {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            text-align: center;
            border: 1px solid transparent;
        }

        .alert-custom-error {
            background: rgba(220, 53, 69, 0.1);
            color: #fca5a5;
            border-color: rgba(220, 53, 69, 0.2);
        }

        .alert-custom-logout {
            background: rgba(25, 135, 84, 0.1);
            color: #86efac;
            border-color: rgba(25, 135, 84, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="login-titulo">Tech Spark</h1>
        <p class="login-subtitulo">Inicia sesión para continuar</p>

        <div class="alert-custom alert-custom-error" th:if="${param.error}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> Usuario o contraseña incorrectos
        </div>

        <div class="alert-custom alert-custom-logout" th:if="${param.logout}">
            <i class="bi bi-check-circle-fill me-2"></i> Sesión cerrada correctamente
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3.5">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" autocomplete="off"
                           name="username" placeholder="Ingresa tu usuario" required>
                </div>
            </div>
            
            <div class="mb-4 mt-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password"
                           name="password" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            
            <button type="submit" class="btn-login">
                Iniciar sesión <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>

</body>
</html>
