<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Spark - Registro de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <aside class="sidebar-custom">
        <div class="sidebar-brand">
            <a href="/" class="navbar-brand-text">Tech Spark</a>
        </div>
        
        <ul class="sidebar-links">
            <li><a th:href="@{/}"><i class="bi bi-house-door"></i> <span>Inicio</span></a></li>
            <li><a th:href="@{/proveedores}"><i class="bi bi-truck"></i> <span>Proveedores</span></a></li>
            <li><a th:href="@{/productos}"><i class="bi bi-box-seam"></i> <span>Productos</span></a></li>
        </ul>
        
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout-custom">
                    <i class="bi bi-box-arrow-left"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </aside>
    
    <div class="navbar-mobil">
        <a href="/" class="navbar-brand-text">Tech Spark</a>
        <button class="btn btn-hamburguesa" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuMovilDesplegable" aria-controls="menuMovilDesplegable">
            <i class="bi bi-list"></i>
        </button>
    </div>
	
    <div class="offcanvas offcanvas-start offcanvas-custom" tabindex="-1" id="menuMovilDesplegable" aria-labelledby="menuMovilDesplegableLabel">
        <div class="offcanvas-header d-flex align-items-center justify-content-between">
            <h5 class="navbar-brand-text id="menuMovilDesplegableLabel"">Tech Spark</h5>
            <button type="button" class="btn-close-white-custom" data-bs-dismiss="offcanvas" aria-label="Close">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="offcanvas-body">
            <ul class="sidebar-links">
                <li><a th:href="@{/}"><i class="bi bi-house-door"></i> Inicio</a></li>
                <li><a th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a></li>
                <li><a th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
            </ul>
            
            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout-custom">
                        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <main class="contenido-principal-form">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6 col-xl-5">
                    
                    <div class="card card-form-custom">
                        <div class="card-header card-header-custom">
                            <h4 class="card-title-custom mb-0">
                                <i class="bi bi-plus-circle me-2"></i>Registrar Producto
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            
                            <form th:action="@{/productos/save}" th:object="${producto}" method="post" autocomplete="off">
                            
                                <input type="hidden" th:field="*{id}">
                                
                                <!-- Campo: Nombre -->
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre producto</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                        <input type="text" th:field="*{nombre}"
                                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                               class="form-control" id="nombre"
                                               placeholder="Ingresa el nombre del producto"
                                               maxlength="100">
                                    </div>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('nombre')}"
                                         th:errors="*{nombre}"></div>
                                </div>

                                <!-- Campo: Precio -->
                                <div class="mb-3">
                                    <label for="precio" class="form-label">Precio</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                        <input type="number" th:field="*{precio}"
                                               th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'"
                                               class="form-control field-auto-clear" id="precio"
                                               placeholder="Ej. 299.99" step="0.01" min="0.01">
                                    </div>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('precio')}"
                                         th:errors="*{precio}"></div>
                                </div>
                                
                                <!-- Campo: Stock -->
                                <div class="mb-3">
                                    <label for="stock" class="form-label">Stock</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-boxes"></i></span>
                                        <input type="number" th:field="*{stock}"
                                               th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"
                                               class="form-control field-auto-clear" id="stock"
                                               placeholder="Ej. 50" step="1" min="0">
                                    </div>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('stock')}"
                                         th:errors="*{stock}"></div>
                                </div>
                                
                                <!-- Campo: Proveedor -->
                                <div class="mb-4">
                                    <label for="proveedor" class="form-label">Proveedor</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-truck"></i></span>
                                        <select th:field="*{proveedor}" id="proveedor"
                                                th:classappend="${#fields.hasErrors('proveedor')} ? 'is-invalid'"
                                                class="form-select">
                                            <option value="">-- Selecciona un proveedor --</option>
                                            <option th:each="proveedor : ${proveedores}"
                                                    th:value="${proveedor.id}"
                                                    th:text="${proveedor.nombreEmpresa}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('proveedor')}"
                                         th:errors="*{proveedor}"></div>
                                </div>

                                <!-- Botones -->
                                <div class="d-flex flex-column gap-2 mt-4">
                                    <button type="submit" class="btn-guardar">
                                        <i class="bi bi-floppy me-2"></i>Guardar
                                    </button>
                                    <a th:href="@{/productos}" class="btn-cancelar text-center text-decoration-none">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const inputsNumericos = document.querySelectorAll('.field-auto-clear');

            inputsNumericos.forEach(input => {
                input.addEventListener('focus', function() {
                    const valorActual = parseFloat(this.value);
                    if (valorActual === 0 || this.value === '0.0' || this.value === '0') {
                        this.value = '';
                    }
                });

                input.addEventListener('blur', function() {
                    if (this.value.trim() === '') {
                        this.value = this.id === 'precio' ? '0.0' : '0';
                    }
                });
            });
        });
    </script>
</body>
</html>
